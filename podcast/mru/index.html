<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f5f5f7" />
    <title>MRU Symposium</title>
    <meta
      name="description"
      content="A talk from Two Smiles Media for the Mount Royal University symposium — AI without chat."
    />
    <link rel="stylesheet" href="styles.css" />
    <style>
      .wrap {
        max-width: min(96vw, calc(88vh * 16 / 9));
      }
      header {
        margin-bottom: 1rem;
      }
      .card {
        padding: 0.5rem;
      }
      video {
        display: block;
        width: 100%;
        aspect-ratio: 16 / 9;
        border-radius: 10px;
        background: #000;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1>MRU Symposium</h1>
      </header>

      <div class="card">
        <video
          id="player"
          controls
          playsinline
          preload="metadata"
          src="https://twosmiles-podcasts.s3.amazonaws.com/mru/mru-symposium.mp4?v=20261022"
        ></video>
      </div>
    </div>
  </body>
</html>
